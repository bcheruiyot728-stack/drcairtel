services:
  - type: web
    name: drcairtel-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /api/offres
    autoDeploy: true
    envVars:
      - key: PORT
        value: 4000
      - key: TELEGRAM_ENABLED
        value: false

  - type: static
    name: drcairtel-frontend
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        value: https://drcairtel-backend.onrender.com
